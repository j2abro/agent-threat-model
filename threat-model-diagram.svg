<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 24 1000 752" role="img" aria-label="Threat model diagram: untrusted input, agent with LLM, runtime and tools, trusted enterprise data" width="1000" height="780"><style>svg.diagram{--bg:#fff;--card:#fff;--ink:#1B2330;--mute:#5E6B7C;--line:#D5DBE3;--ok:#1F9D8B;--lo:#3B82C4;--warn:#D9822B;--bad:#D6453D}
.diagram text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
.diagram .t{font-size:16px;font-weight:650}
.diagram .t.big{font-size:19px}
.diagram .sub{font-size:12px;fill:var(--mute)}
.diagram .st{font-size:12px;font-weight:600}
.diagram .lbl{font-size:12px;fill:var(--mute);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.diagram .zt{font-size:11px;font-weight:700;letter-spacing:.08em;fill:var(--c)}
.diagram .s0,.diagram .e0{--c:var(--ok)}
.diagram .s1,.diagram .e1{--c:var(--lo)}
.diagram .s2,.diagram .e2{--c:var(--warn)}
.diagram .s3,.diagram .e3{--c:var(--bad)}
.diagram .body{fill:var(--card)}
.diagram .tint{fill:var(--c);opacity:.07}
.diagram .border{fill:none;stroke:var(--c);stroke-width:1.8}
.diagram .halo{fill:none;stroke:var(--c);stroke-width:9;opacity:0}
.diagram .node.s2 .halo{opacity:.16}
.diagram .node.s3 .halo{opacity:.28}
.diagram .zbox{fill:var(--c);fill-opacity:.05;stroke:var(--c);stroke-width:2}
.diagram .zbox.dash{stroke-dasharray:8 6}
.diagram .line{fill:none;stroke:var(--c);stroke-width:2.4}
.diagram .edge.blocked .line{stroke:var(--mute);opacity:.6;stroke-dasharray:4 5}
.diagram .int{fill:none;stroke:var(--mute);opacity:.5;stroke-width:1.6}
.diagram .resid{font-size:11px;font-weight:800;paint-order:stroke;stroke:var(--card);stroke-width:3px}
.diagram .otag{font-family:ui-monospace,Menlo,monospace;font-size:10px;font-weight:700;letter-spacing:.04em;paint-order:stroke;stroke:var(--card);stroke-width:3px}
.diagram.simming .node:not(.simhit):not(.simlimited):not(.simsafe),.diagram.simming .edge:not(.simhit):not(.simlimited):not(.simblock),.diagram.simming .int,.diagram.simming .zone{opacity:.3;transition:opacity .4s}
.diagram .node.simhit .tint{opacity:.42;fill:var(--bad)}
.diagram .node.simhit .border{stroke:var(--bad);stroke-width:4.5}
.diagram .node.simhit .halo{stroke:var(--bad);stroke-width:16;opacity:.45;animation:glow 1s ease-in-out infinite alternate}
.diagram .node.simlimited .tint{opacity:.34;fill:var(--warn)}
.diagram .node.simlimited .border{stroke:var(--warn);stroke-width:4.5}
.diagram .node.simsafe .tint{opacity:.3;fill:var(--ok)}
.diagram .node.simsafe .border{stroke:var(--ok);stroke-width:4.5}
.diagram .edge.simhit .line{stroke:var(--bad);stroke-width:6;stroke-dasharray:none;opacity:1;filter:drop-shadow(0 0 5px var(--bad))}
.diagram .edge.simlimited .line{stroke:var(--warn);stroke-width:6;stroke-dasharray:none;opacity:1;filter:drop-shadow(0 0 5px var(--warn))}
.diagram .edge.simblock .line{stroke:var(--ok);stroke-width:5;stroke-dasharray:8 6;opacity:1}
.diagram .int.simhit,.diagram .int.simlimited{opacity:1;stroke-width:5;stroke:var(--bad)}
.diagram .int.simlimited{stroke:var(--warn)}
.diagram .int.simblock{opacity:1;stroke-width:4;stroke:var(--ok)}
.diagram .gate.simblock{animation:pop .8s ease-out;opacity:1}
.diagram.simming .gate{opacity:.5}
.diagram.simming .gate.simblock{opacity:1}
.diagram .packet .pglow{animation:ping .9s ease-out infinite;transform-box:fill-box;transform-origin:center}
.diagram .simbadge rect{fill:var(--bad);stroke:var(--card);stroke-width:2.5}
.diagram .simbadge.limited rect{fill:var(--warn)}
.diagram .simbadge.block rect{fill:var(--ok)}
.diagram .simbadge text{fill:#fff;font-size:11px;font-weight:800;letter-spacing:.05em;paint-order:normal;stroke:none}
@keyframes glow{from{opacity:.25}to{opacity:.6}}
@keyframes ping{from{transform:scale(.6);opacity:.5}to{transform:scale(1.5);opacity:0}}
.diagram .pl rect{fill:var(--c);opacity:.18}
.diagram .pl text{fill:var(--c);font-size:10px;font-weight:800;letter-spacing:.04em}
.diagram .pl.off text{fill:var(--mute);font-size:12px;font-weight:400}
.diagram .m0{fill:var(--ok)}.diagram .m1{fill:var(--lo)}.diagram .m2{fill:var(--warn)}.diagram .m3{fill:var(--bad)}.diagram .mb{fill:var(--mute)}
.diagram.focus .edge:not(.on),.diagram.focus .node:not(.on),.diagram.focus .zone:not(.on),.diagram.focus .gate{opacity:.22}
.diagram .edge.on .line{stroke-width:3.2;stroke-dasharray:7 6;animation:dash .9s linear infinite}
.diagram .node.simhit .halo{opacity:.5;stroke:var(--bad)}
.diagram .node.simhit .border{stroke:var(--bad)}
.diagram .edge.simhit .line{stroke:var(--bad);stroke-dasharray:7 6;animation:dash .8s linear infinite;opacity:1}
.diagram .edge.simblock .line{stroke:var(--ok);opacity:1;stroke-dasharray:none}
.diagram .gate.simblock{animation:pop .7s ease-out}
@keyframes dash{to{stroke-dashoffset:-13}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.diagram *{animation:none!important}}

.diagram .s-1,.diagram .s0,.diagram .s1,.diagram .s2,.diagram .s3,.diagram .e0,.diagram .e1,.diagram .e2,.diagram .e3{--c:#3E6FB0}
.diagram .halo{display:none}
.diagram .zbox.dash{stroke-dasharray:none}
.diagram .edge .line{stroke-dasharray:none!important;opacity:1!important}
.m0,.m1,.m2,.m3{fill:#3E6FB0}
